databaseChangeLog:
  - changeSet:
      id: 001-create-venue
      author: kerher
      changes:
        - createTable:
            tableName: venue
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-event
      author: kerher
      changes:
        - createTable:
            tableName: event
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: venue_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_venue
                    references: venue(id)
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_event_venue
            tableName: event
            columns:
              - column:
                  name: venue_id

  - changeSet:
      id: 003-create-event-session
      author: kerher
      changes:
        - createTable:
            tableName: event_session
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_session_event
                    references: event(id)
              - column:
                  name: starts_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ends_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_session_event
            tableName: event_session
            columns:
              - column:
                  name: event_id